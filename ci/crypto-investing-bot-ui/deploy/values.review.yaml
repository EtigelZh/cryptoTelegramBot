ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: $CI_REF_SLUG.app-review.dev.meteora.pro
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: $CI_REF_SLUG-app-review-meteora-pro-tls
      hosts:
        - $CI_REF_SLUG.app-review.dev.meteora.pro
