service:
  type: ClusterIP
  port: 3333
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: crypto-investing-bot.meteora.pro
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: crypto-investing-bot-meteora-pro-tls
      hosts:
        - crypto-investing-bot.meteora.pro